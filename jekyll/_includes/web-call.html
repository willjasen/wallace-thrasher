<div class="web-call" data-web-call data-token-url="https://stretchie-hotline-9504.twil.io/token">
  <button
    class="web-call__launcher"
    type="button"
    aria-expanded="false"
    aria-controls="web-call-panel"
  >
    <span aria-hidden="true">📞</span>
    <span>call</span>
  </button>

  <section class="web-call__panel" id="web-call-panel" aria-label="Call Stretchie" hidden>
    <div class="web-call__heading">
      <strong>call</strong>
      <button class="web-call__close" type="button" aria-label="Close call controls">×</button>
    </div>
    <p class="web-call__status" role="status" aria-live="polite">Ready to call through your browser.</p>
    <div class="web-call__actions">
      <button class="web-call__start" type="button">call</button>
      <button class="web-call__mute" type="button" aria-pressed="false">mute</button>
    </div>
    <div class="web-call__keypad" aria-label="Call keypad" hidden>
      {% for digit in (1..9) %}<button type="button" data-digit="{{ digit }}">{{ digit }}</button>{% endfor %}
      <button type="button" data-digit="*">*</button>
      <button type="button" data-digit="0">0</button>
      <button type="button" data-digit="#">#</button>
    </div>
    <small>Uses your microphone and internet connection. No phone number is dialed.</small>
  </section>
</div>
<link rel="stylesheet" href="{{ '/assets/css/web-call.css' | relative_url }}">
<script src="{{ '/assets/vendor/twilio-voice.min.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/web-call.js' | relative_url }}" defer></script>
