[build]
  base    = "jekyll"
  command = "JEKYLL_ENV=production bundle exec jekyll build --baseurl \"\""
  publish = "_site"
  edge_functions = "_netlify/edge-functions"

[build.environment]
  BUNDLE_PATH = "vendor/bundle"
  JEKYLL_ENV = "production"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

# Redirect the legacy root URL at the edge so crawlers and visitors receive a
# single permanent redirect without having to execute the JavaScript fallback
# generated by jekyll/index.markdown.
[[redirects]]
  from = "/"
  to = "/about/"
  status = 301
  force = true

[build.cache]
  paths = [
    "jekyll/vendor/bundle",
    "$HOME/.local/share/mise/installs/ruby"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://github.com https://img.shields.io https://api.netlify.com https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com https://api.netlify.com https://www.google-analytics.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.twil.io https://*.twilio.com wss://*.twilio.com; media-src 'self' blob:; font-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
